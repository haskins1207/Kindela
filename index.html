<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kindela unifies donors, grants, donated-goods inventory, accounting, and volunteers in one place — and shows the public exactly where every dollar and every coat goes."
    />
    <meta property="og:title" content="Kindela — The Operating System for Mission-Driven Nonprofits" />
    <meta
      property="og:description"
      content="Put your time where it really matters — the mission, not the spreadsheets. Every donation, grant, and good — connected and visible."
    />
    <meta property="og:type" content="website" />
    <title>Kindela — The Operating System for Mission-Driven Nonprofits</title>
    <script>
      // Set theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('kindela-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
